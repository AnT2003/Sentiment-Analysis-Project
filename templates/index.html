<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentiment Analysis | Big Data Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6C5CE7;
            --primary-hover: #5A4FCF;
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --positive: #10b981;
            --neutral: #fbbf24;
            --negative: #ef4444;
        }

        body {
            font-family: 'Outfit', sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(108, 92, 231, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.1) 0px, transparent 50%);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 600px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease;
        }

        .container:hover {
            transform: translateY(-5px);
        }

        h1 {
            text-align: center;
            font-size: 2.5rem;
            margin-top: 0;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #a8c0ff 0%, #3f2b96 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }

        p.subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 30px;
            font-size: 1.1rem;
            font-weight: 300;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 1rem;
            color: var(--text-muted);
        }

        select, textarea {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-main);
            border-radius: 12px;
            padding: 15px;
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            box-sizing: border-box;
        }

        select:focus, textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.3);
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        button {
            width: 100%;
            padding: 15px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            font-family: 'Outfit', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(108, 92, 231, 0.3);
        }

        button:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(108, 92, 231, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .result-box {
            margin-top: 30px;
            padding: 20px;
            border-radius: 16px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 0.4s ease, transform 0.4s ease;
            display: none;
        }

        .result-box.show {
            display: block;
            opacity: 1;
            transform: scale(1);
        }

        .sentiment-label {
            font-size: 2rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .confidence {
            font-size: 1rem;
            color: var(--text-muted);
        }

        /* Sentiment Colors */
        .is-positive { color: var(--positive); text-shadow: 0 0 10px rgba(16, 185, 129, 0.5); }
        .is-neutral { color: var(--neutral); text-shadow: 0 0 10px rgba(251, 191, 36, 0.5); }
        .is-negative { color: var(--negative); text-shadow: 0 0 10px rgba(239, 68, 68, 0.5); }

        /* Loader */
        .loader {
            display: none;
            margin: 20px auto;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: var(--primary);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

    </style>
</head>
<body>

    <div class="container">
        <h1>Review Analysis</h1>
        <p class="subtitle">AI-powered sentiment classification using Big Data techniques</p>

        <div class="form-group">
            <label for="modelSelect">Select AI Model</label>
            <select id="modelSelect">
                <option value="xgboost">XGBoost (Fast & Reliable)</option>
                <option value="bilstm">BiLSTM (Deep Learning Sequence)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="comment">Enter your comment in Vietnamese</label>
            <textarea id="comment" placeholder="Ví dụ: Sản phẩm này dùng rất tuyệt vời, giao hàng siêu nhanh!"></textarea>
        </div>

        <button id="predictBtn" onclick="analyzeSentiment()">Analyze Sentiment</button>

        <div class="loader" id="loader"></div>

        <div class="result-box" id="resultBox">
            <div class="sentiment-label" id="sentimentLabel"></div>
            <div class="confidence" id="confidenceLabel"></div>
        </div>
    </div>

    <script>
        async function analyzeSentiment() {
            const comment = document.getElementById('comment').value.trim();
            const model = document.getElementById('modelSelect').value;
            const resultBox = document.getElementById('resultBox');
            const loader = document.getElementById('loader');
            const btn = document.getElementById('predictBtn');

            if (!comment) {
                alert("Please enter a comment to analyze.");
                return;
            }

            // UI feedback
            resultBox.classList.remove('show');
            setTimeout(() => { resultBox.style.display = 'none'; }, 400); // Wait for transition
            loader.style.display = 'block';
            btn.disabled = true;
            btn.style.opacity = '0.7';

            try {
                const response = await fetch(`/api/predict/${model}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ comment: comment })
                });

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    const errorMsg = errorData.detail || "API Error or Model not ready yet!";
                    throw new Error(errorMsg);
                }

                const data = await response.json();
                displayResult(data.sentiment, data.confidence);
            } catch (error) {
                console.error(error);
                alert(`Error: ${error.message}`);
            } finally {
                loader.style.display = 'none';
                btn.disabled = false;
                btn.style.opacity = '1';
            }
        }

        function displayResult(sentiment, confidence) {
            const resultBox = document.getElementById('resultBox');
            const label = document.getElementById('sentimentLabel');
            const conf = document.getElementById('confidenceLabel');

            label.innerText = sentiment;
            // Remove old classes
            label.className = 'sentiment-label';
            
            if (sentiment.toLowerCase() === 'positive') label.classList.add('is-positive');
            else if (sentiment.toLowerCase() === 'negative') label.classList.add('is-negative');
            else label.classList.add('is-neutral');

            if (confidence) {
                conf.innerText = `Confidence: ${(confidence * 100).toFixed(2)}%`;
            } else {
                conf.innerText = "";
            }

            resultBox.style.display = 'block';
            // Slight delay to trigger CSS transition
            setTimeout(() => {
                resultBox.classList.add('show');
            }, 10);
        }
    </script>
</body>
</html>
